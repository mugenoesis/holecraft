# Weekly update pull requests. They run through the same CI as any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Everything that only runs during development, as one PR instead of many.
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # These two are pinned to an exact version on purpose and must move together with other things, so
      # they are updated by hand: @playwright/test must match the Docker image tag in scripts/e2e.sh and
      # scripts/screenshot.sh, and electron must be exact for electron-builder.
      - dependency-name: '@playwright/test'
      - dependency-name: electron
      # biome.json names the Biome version in its $schema URL; update both together (npx biome migrate).
      - dependency-name: '@biomejs/biome'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
