name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: scripts/check.sh
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Fails if anything that ships has a known vulnerability; build tools are reported only.
      - run: scripts/audit.sh

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: scripts/docker-smoke.sh holecraft:ci
      # hadolint on the Dockerfile; trivy on its configuration and on the built image (HIGH/CRITICAL with a fix)
      - run: scripts/docker-lint.sh holecraft:ci

  desktop:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: LOCAL=1 scripts/package-desktop.sh
      - run: SKIP_BUILD=1 scripts/e2e.sh --project desktop
      - uses: actions/upload-artifact@v7
        with:
          name: holecraft-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
