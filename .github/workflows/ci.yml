name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: scripts/check.sh

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: scripts/docker-smoke.sh ezcad:ci

  desktop:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: LOCAL=1 scripts/package-desktop.sh
      - run: SKIP_BUILD=1 scripts/e2e.sh --project desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ezcad-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
